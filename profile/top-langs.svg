          <rect class="hudSweep" x="245" y="241" width="6" height="12"
                rx="6" fill="#8B7CFF" opacity=".28"
                style="animation-delay:0.6s"/>

          <text x="850" y="252" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13px" font-weight="700" letter-spacing="0px" fill="#8B7CFF" fill-opacity="1" text-anchor="end">1.1%</text>

          <line x1="48" y1="281" x2="850" y2="281"
                stroke="#141C21" stroke-width="1"/>
        </g>
        
        <g>
          <text x="48" y="305" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15px" font-weight="700" letter-spacing="0.8px" fill="#F3F5F7" fill-opacity="1" text-anchor="start">JAVASCRIPT</text>
          <text x="48" y="326" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11px" font-weight="700" letter-spacing="0px" fill="#46515A" fill-opacity="1" text-anchor="start">108 B</text>

          <rect x="245" y="291" width="575" height="12"
                rx="6" fill="#11171B"/>
          <rect x="245" y="291" width="4" height="12"
