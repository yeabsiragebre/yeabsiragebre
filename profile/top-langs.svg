          <text x="40" y="238" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="700" letter-spacing="1px" fill="#F4F7F8" fill-opacity="1" text-anchor="start">JAVASCRIPT</text>
          <text x="610" y="238" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="800" letter-spacing="0px" fill="#B7FF4A" fill-opacity="1" text-anchor="end">0.2%</text>
          <rect x="40" y="248" width="570" height="5" rx="2.5" fill="#111A1F"/>
