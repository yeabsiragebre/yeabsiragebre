        <text x="42" y="88" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="9px" font-weight="700" letter-spacing="1px" fill="#64748B" fill-opacity="1" text-anchor="start">CODEBASE // BYTE DISTRIBUTION</text>

