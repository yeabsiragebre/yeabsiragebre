          <rect class="hudSweep" x="245" y="291" width="4" height="12"
                rx="6" fill="#A8E063" opacity=".28"
                style="animation-delay:0.8999999999999999s"/>

          <text x="850" y="302" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13px" font-weight="700" letter-spacing="0px" fill="#A8E063" fill-opacity="1" text-anchor="end">0.2%</text>

          <line x1="48" y1="331" x2="850" y2="331"
                stroke="#141C21" stroke-width="1"/>
        </g>
        

    <rect x="42" y="570" width="816" height="1" fill="#182127"/>

    <text x="42" y="596" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12px" font-weight="700" letter-spacing="0.8px" fill="#F3F5F7" fill-opacity="1" text-anchor="start">LANGUAGE DISTRIBUTION // LIVE GITHUB DATA</text>
    <text x="858" y="596" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12px" font-weight="700" letter-spacing="1.1px" fill="#36E0C0" fill-opacity="1" text-anchor="end">ONLINE</text>

