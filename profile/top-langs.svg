          <text x="850" y="152" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13px" font-weight="700" letter-spacing="0px" fill="#36E0C0" fill-opacity="1" text-anchor="end">97.3%</text>

          <line x1="48" y1="181" x2="850" y2="181"
                stroke="#141C21" stroke-width="1"/>
        </g>
        
        <g>
          <text x="48" y="205" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15px" font-weight="700" letter-spacing="0.8px" fill="#F3F5F7" fill-opacity="1" text-anchor="start">CSS</text>
          <text x="48" y="226" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11px" font-weight="700" letter-spacing="0px" fill="#46515A" fill-opacity="1" text-anchor="start">771 B</text>

          <rect x="245" y="191" width="575" height="12"
