
<svg xmlns="http://www.w3.org/2000/svg"
     width="650"
     height="430"
     viewBox="0 0 650 430">

<style>
    .title {
        font-family: monospace;
        font-size: 25px;
        font-weight: bold;
        fill: #ffffff;
    }

    .label {
        font-family: monospace;
        font-size: 14px;
        fill: #8b9bb4;
        letter-spacing: 2px;
    }

    .language {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #ffffff;
    }

    .percentage {
        font-family: monospace;
        font-size: 13px;
        fill: #8b9bb4;
    }

    .glow {
        filter: url(#glow);
    }

    .pulse {
        animation: pulse 2s infinite;
    }

    .scan {
        animation: scan 4s linear infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
    }

    @keyframes scan {
        from { transform: translateY(-20px); }
        to { transform: translateY(450px); }
    }
</style>

<defs>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#090914"/>
        <stop offset="55%" stop-color="#111124"/>
        <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ff2bd6"/>
        <stop offset="50%" stop-color="#00e5ff"/>
        <stop offset="100%" stop-color="#39ff88"/>
    </linearGradient>

    <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".035"/>
    </pattern>

</defs>

<rect width="650"
      height="430"
      rx="22"
      fill="url(#background)"
      stroke="#24243d"
      stroke-width="2"/>

<rect width="650"
      height="430"
      rx="22"
      fill="url(#grid)"/>

<rect x="0"
      y="0"
      width="650"
      height="3"
      fill="url(#line)"
      class="glow"/>

<rect x="0"
      y="-30"
      width="650"
      height="20"
      fill="#00e5ff"
      opacity=".08"
      class="scan"/>

<text x="35" y="55" class="label">
    LANGUAGE // MATRIX
</text>

<text x="35" y="92" class="title">
    MOST USED LANGUAGES
</text>

<circle cx="590"
        cy="48"
        r="7"
        fill="#39ff88"
        class="pulse glow"/>

<line x1="35"
      y1="112"
      x2="615"
      y2="112"
      stroke="url(#line)"
      stroke-opacity=".5"/>


            <text x="55" y="180" class="language">
                NO LANGUAGE DATA
            </text>
            

</svg>
