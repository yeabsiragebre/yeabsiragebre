<svg
    xmlns="http://www.w3.org/2000/svg"
    width="620"
    height="430"
    viewBox="0 0 620 430">

    
    <defs>

        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#020204"/>

            <stop
                offset="50%"
                stop-color="#0A0D14"/>

            <stop
                offset="100%"
                stop-color="#1A0830"/>

        </linearGradient>


        <linearGradient
            id="purpleGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="0">

            <stop
                offset="0%"
                stop-color="#6D28D9"/>

            <stop
                offset="50%"
                stop-color="#A855F7"/>

            <stop
                offset="100%"
                stop-color="#D8B4FE"/>

        </linearGradient>


        <filter
            id="purpleGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

            <feGaussianBlur
                stdDeviation="3"
                result="blur"/>

            <feMerge>

                <feMergeNode
                    in="blur"/>

                <feMergeNode
                    in="SourceGraphic"/>

            </feMerge>

        </filter>


        <pattern
            id="grid"
            width="32"
            height="32"
            patternUnits="userSpaceOnUse">

            <path
                d="M32 0H0V32"
                fill="none"
                stroke="#8B5CF6"
                stroke-opacity="0.055"/>

        </pattern>

    </defs>
    


    <!-- BACKGROUND -->

    <rect
        width="620"
        height="430"
        rx="18"
        fill="url(#background)"
        stroke="#8B5CF6"
        stroke-opacity="0.55"
        stroke-width="1.5"/>

    <rect
        x="1"
        y="1"
        width="618"
        height="428"
        rx="17"
        fill="url(#grid)"/>


    <!-- HEADER -->

    <text x="35" y="55" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18px" font-weight="700" fill="#F5F3FF" text-anchor="start">◈ LANGUAGE MATRIX</text>

    <text x="585" y="55" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="700" fill="#6B7280" text-anchor="end">CODEBASE</text>


    <!-- NEON LINE -->

    <rect
        x="35"
        y="75"
        width="550"
        height="2"
        fill="url(#purpleGradient)"
        filter="url(#purpleGlow)"/>


    <!-- LANGUAGE ROWS -->

    <text x="55" y="125" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="10px" font-weight="700" fill="#6B7280" text-anchor="start">NO LANGUAGE DATA AVAILABLE</text>


    <!-- FOOTER -->

    <rect
        x="35"
        y="375"
        width="550"
        height="1"
        fill="#8B5CF6"
        fill-opacity="0.25"/>

    <text x="35" y="400" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="700" fill="#6B7280" text-anchor="start">LANGUAGE DISTRIBUTION</text>

    <text x="585" y="400" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="700" fill="#C084FC" text-anchor="end">ANALYSIS COMPLETE</text>

    </svg>
    