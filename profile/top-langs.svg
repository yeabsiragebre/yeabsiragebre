        <text x="852" y="59" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="9px" font-weight="700" letter-spacing="1px" fill="#67E8F9" fill-opacity="1" text-anchor="end">SYSTEM ONLINE</text>

        <text x="852" y="79" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="1px" fill="#475569" fill-opacity="1" text-anchor="end">LANGUAGE ANALYSIS</text>

