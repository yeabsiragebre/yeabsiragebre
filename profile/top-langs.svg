          <text x="850" y="189" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="9px" font-weight="700" letter-spacing="0px" fill="#63B3FF" fill-opacity="1" text-anchor="end">1.4%</text>

          <line x1="48" y1="221" x2="850" y2="221"
