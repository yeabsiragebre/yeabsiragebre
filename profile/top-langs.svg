          <text x="40" y="112" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="700" letter-spacing="1px" fill="#F4F7F8" fill-opacity="1" text-anchor="start">PYTHON</text>
          <text x="610" y="112" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="800" letter-spacing="0px" fill="#00F5D4" fill-opacity="1" text-anchor="end">97.0%</text>
