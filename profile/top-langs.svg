          <text x="48" y="276" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11px" font-weight="700" letter-spacing="0px" fill="#46515A" fill-opacity="1" text-anchor="start">628 B</text>

          <rect x="245" y="241" width="575" height="12"
