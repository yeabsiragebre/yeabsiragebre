<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500">
  
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020304"/>
    <stop offset="48%" stop-color="#070B0E"/>
    <stop offset="100%" stop-color="#020405"/>
  </linearGradient>

  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
    <stop offset="20%" stop-color="#00F5D4" stop-opacity=".95"/>
    <stop offset="55%" stop-color="#9B7BFF" stop-opacity=".9"/>
    <stop offset="82%" stop-color="#FF4FD8" stop-opacity=".75"/>
    <stop offset="100%" stop-color="#FF4FD8" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="cyanSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00F5D4" stop-opacity=".05"/>
    <stop offset="48%" stop-color="#00F5D4" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#00C2FF" stop-opacity=".05"/>
  </linearGradient>

  <linearGradient id="violetSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9B7BFF" stop-opacity=".04"/>
    <stop offset="50%" stop-color="#FF4FD8" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#9B7BFF" stop-opacity=".04"/>
  </linearGradient>

  <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#8EA3AE" stroke-opacity=".055"/>
  </pattern>

  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0 0H6" stroke="#FFFFFF" stroke-opacity=".018"/>
  </pattern>

  <filter id="glowC" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>

  <filter id="glowXL" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="28"/>
  </filter>

  <clipPath id="clip900"><rect x="0" y="0" width="900" height="540" rx="24"/></clipPath>
  <clipPath id="clip720"><rect x="0" y="0" width="720" height="500" rx="24"/></clipPath>

  <style>
    .blink { animation: blink 2.2s ease-in-out infinite; }
    .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin:center; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    .scanmove { animation: scanmove 5s linear infinite; }
    @keyframes blink { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.96); } 50% { opacity:.95; transform:scale(1.04); } }
    @keyframes drift { from { transform:translateX(-18px); } to { transform:translateX(18px); } }
    @keyframes scanmove { from { transform:translateY(-80px); } to { transform:translateY(600px); } }
  </style>
</defs>

  <g clip-path="url(#clip720)">
    
      <rect width="680" height="500" fill="url(#bg)"/>
      <rect width="680" height="500" fill="url(#microgrid)"/>
      <rect width="680" height="500" fill="url(#scan)"/>

      <circle class="drift" cx="120" cy="75" r="95" fill="#00F5D4"
              opacity=".045" filter="url(#glowXL)"/>
      <circle class="pulse" cx="790" cy="430" r="105" fill="#FF4FD8"
              opacity=".035" filter="url(#glowXL)"/>

      <g opacity=".22">
        <path d="M0 86H680" stroke="#00F5D4" stroke-opacity=".08"/>
        <path d="M0 430H680" stroke="#9B7BFF" stroke-opacity=".07"/>
      </g>

      <rect class="scanmove" x="0" y="-100" width="680" height="70"
            fill="url(#cyanSweep)" opacity=".14"/>
      <g transform="rotate(150 450 270)" opacity=".025">
        <circle cx="450" cy="270" r="240" fill="none" stroke="#00F5D4" stroke-width="1"/>
