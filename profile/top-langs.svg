          <text x="48" y="259" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="0px" fill="#46515A" fill-opacity="1" text-anchor="start">628 B</text>

          <rect x="245" y="230" width="575" height="8"
