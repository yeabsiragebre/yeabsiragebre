          <text x="850" y="237" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="9px" font-weight="700" letter-spacing="0px" fill="#8B7CFF" fill-opacity="1" text-anchor="end">1.1%</text>

          <line x1="48" y1="269" x2="850" y2="269"
