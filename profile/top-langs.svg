
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="620" viewBox="0 0 900 620">

  
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#040607"/>
    <stop offset="55%" stop-color="#080B0E"/>
    <stop offset="100%" stop-color="#030405"/>
  </linearGradient>

  <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#36E0C0" stop-opacity="0"/>
    <stop offset="18%" stop-color="#36E0C0" stop-opacity=".85"/>
    <stop offset="52%" stop-color="#63B3FF" stop-opacity=".9"/>
    <stop offset="82%" stop-color="#8B7CFF" stop-opacity=".65"/>
    <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#36E0C0"/>
    <stop offset="100%" stop-color="#63B3FF"/>
  </linearGradient>

  <linearGradient id="violetBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#63B3FF"/>
    <stop offset="100%" stop-color="#8B7CFF"/>
  </linearGradient>

  <pattern id="microgrid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#64727C" stroke-opacity=".035"/>
  </pattern>

  <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
    <path d="M0 0H4" stroke="#FFFFFF" stroke-opacity=".012"/>
  </pattern>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    .scanmove { animation:scanmove 7s linear infinite; }
    .float { animation:float 8s ease-in-out infinite alternate; }
    @keyframes pulse {
      0%,100% { opacity:.35; }
      50% { opacity:1; }
    }
    @keyframes scanmove {
      from { transform:translateY(-100px); }
      to { transform:translateY(720px); }
    }
    @keyframes float {
      from { transform:translateX(-14px); }
      to { transform:translateX(14px); }
    }
    .hudPulse { animation:hudPulse 3.2s ease-in-out infinite; }
    .hudSweep { animation:hudSweep 6s linear infinite; }
    .hudRotate { transform-origin:450px 310px; animation:hudRotate 24s linear infinite; }
    .hudFlicker { animation:hudFlicker 4.5s ease-in-out infinite; }
    @keyframes hudPulse {
      0%,100% { opacity:.25; }
      50% { opacity:.85; }
    }
    @keyframes hudSweep {
      from { transform:translateX(-180px); opacity:0; }
      12% { opacity:.7; }
      50% { opacity:.35; }
      88% { opacity:.7; }
      to { transform:translateX(1180px); opacity:0; }
    }
    @keyframes hudRotate {
      from { transform:rotate(0deg); }
      to { transform:rotate(360deg); }
    }
    @keyframes hudFlicker {
      0%,96%,100% { opacity:1; }
      97% { opacity:.55; }
      98% { opacity:.9; }
    }
  </style>
</defs>


  <defs>
