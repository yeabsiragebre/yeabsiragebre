    <rect x="40" y="456" width="600" height="1" fill="#182228"/>
    <text x="40" y="477" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="6.5px" font-weight="700" letter-spacing="1px" fill="#364149" fill-opacity="1" text-anchor="start">PRIMARY LANGUAGES ACROSS REPOSITORIES</text>
    <text x="640" y="477" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="6.5px" font-weight="700" letter-spacing="1px" fill="#00F5D4" fill-opacity="1" text-anchor="end">SYNC // 2026-08-10</text>
