
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="620" viewBox="0 0 900 620">

  
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#040607"/>
    <stop offset="55%" stop-color="#080B0E"/>
    <stop offset="100%" stop-color="#030405"/>
  </linearGradient>

  <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#36E0C0" stop-opacity="0"/>
    <stop offset="18%" stop-color="#36E0C0" stop-opacity=".85"/>
    <stop offset="52%" stop-color="#63B3FF" stop-opacity=".9"/>
    <stop offset="82%" stop-color="#8B7CFF" stop-opacity=".65"/>
    <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#36E0C0"/>
    <stop offset="100%" stop-color="#63B3FF"/>
  </linearGradient>

  <linearGradient id="violetBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#63B3FF"/>
    <stop offset="100%" stop-color="#8B7CFF"/>
  </linearGradient>

  <pattern id="microgrid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#64727C" stroke-opacity=".035"/>
  </pattern>

  <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
    <path d="M0 0H4" stroke="#FFFFFF" stroke-opacity=".012"/>
  </pattern>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    .scanmove { animation:scanmove 7s linear infinite; }
    .float { animation:float 8s ease-in-out infinite alternate; }
    @keyframes pulse {
      0%,100% { opacity:.35; }
      50% { opacity:1; }
    }
    @keyframes scanmove {
      from { transform:translateY(-100px); }
      to { transform:translateY(720px); }
    }
    @keyframes float {
      from { transform:translateX(-14px); }
      to { transform:translateX(14px); }
    }
    .hudPulse { animation:hudPulse 3.2s ease-in-out infinite; }
    .hudSweep { animation:hudSweep 6s linear infinite; }
    .hudRotate { transform-origin:450px 310px; animation:hudRotate 24s linear infinite; }
    .hudFlicker { animation:hudFlicker 4.5s ease-in-out infinite; }
    @keyframes hudPulse {
      0%,100% { opacity:.25; }
      50% { opacity:.85; }
    }
    @keyframes hudSweep {
      from { transform:translateX(-180px); opacity:0; }
      12% { opacity:.7; }
      50% { opacity:.35; }
      88% { opacity:.7; }
      to { transform:translateX(1180px); opacity:0; }
    }
    @keyframes hudRotate {
      from { transform:rotate(0deg); }
      to { transform:rotate(360deg); }
    }
    @keyframes hudFlicker {
      0%,96%,100% { opacity:1; }
      97% { opacity:.55; }
      98% { opacity:.9; }
    }
  </style>
</defs>


  <defs>
    <clipPath id="languageClip">
      <rect x="0" y="0" width="900" height="620" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#languageClip)">
    <rect width="900" height="620" fill="#030506"/>
    <rect width="900" height="620" fill="url(#bg)"/>
    <rect width="900" height="620" fill="url(#microgrid)"/>
    <rect width="900" height="620" fill="url(#scan)"/>

    <g class="hudRotate" opacity=".11">
      <circle cx="450" cy="620" r="340" fill="none"
              stroke="#36E0C0" stroke-width="1"/>
      <circle cx="450" cy="620" r="300" fill="none"
              stroke="#8B7CFF" stroke-width="1"/>
    </g>

    <rect class="hudSweep" x="-180" y="0" width="180" height="620"
          fill="url(#accentLine)" opacity=".035"/>

    <circle cx="820" cy="80" r="130" fill="#8B7CFF"
            opacity=".018" filter="url(#softGlow)"/>
    <circle cx="70" cy="550" r="120" fill="#36E0C0"
            opacity=".02" filter="url(#softGlow)"/>

    <rect x="1" y="1" width="898" height="618" rx="20"
          fill="none" stroke="#273139" stroke-opacity=".9"/>

    <line x1="18" y1="18" x2="32" y2="18" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="18" y1="18" x2="18" y2="32" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="868" y1="18" x2="882" y2="18" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="882" y1="18" x2="882" y2="32" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="18" y1="602" x2="32" y2="602" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="18" y1="588" x2="18" y2="602" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="868" y1="602" x2="882" y2="602" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/><line x1="882" y1="588" x2="882" y2="602" stroke="#36E0C0" stroke-width="1" stroke-opacity="0.8"/>

    <rect x="42" y="27" width="816" height="2"
          fill="url(#accentLine)" filter="url(#glow)"/>

    <text x="42" y="67" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="28px" font-weight="800" letter-spacing="1.4px" fill="#F3F5F7" fill-opacity="1" text-anchor="start">LANGUAGE MATRIX</text>
    <text x="42" y="96" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12px" font-weight="700" letter-spacing="1.6px" fill="#7D8992" fill-opacity="1" text-anchor="start">CODEBASE // BYTE DISTRIBUTION // LIVE REPOSITORY ANALYSIS</text>

    <circle class="pulse" cx="782" cy="53" r="4"
            fill="#36E0C0" filter="url(#glow)"/>
    <text x="852" y="56" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="8px" font-weight="700" letter-spacing="1.1px" fill="#36E0C0" fill-opacity="1" text-anchor="end">SYSTEM ONLINE</text>
    <text x="852" y="75" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="1px" fill="#46515A" fill-opacity="1" text-anchor="end">LANGUAGE ANALYSIS</text>

    <text x="48" y="116" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12px" font-weight="700" letter-spacing="1.2px" fill="#7D8992" fill-opacity="1" text-anchor="start">4 PRIMARY LANGUAGES</text>
    <text x="850" y="116" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12px" font-weight="700" letter-spacing="1px" fill="#46515A" fill-opacity="1" text-anchor="end">4 TOTAL DETECTED</text>

    
        <g>
          <text x="48" y="155" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15px" font-weight="700" letter-spacing="0.8px" fill="#F3F5F7" fill-opacity="1" text-anchor="start">PYTHON</text>
          <text x="48" y="176" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11px" font-weight="700" letter-spacing="0px" fill="#46515A" fill-opacity="1" text-anchor="start">53.4 KB</text>

          <rect x="245" y="141" width="575" height="12"
                rx="6" fill="#11171B"/>
          <rect x="245" y="141" width="559" height="12"
                rx="6" fill="#36E0C0" filter="url(#glow)"/>
          <rect class="hudSweep" x="245" y="141" width="559" height="12"
