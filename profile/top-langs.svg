          <text x="850" y="285" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="9px" font-weight="700" letter-spacing="0px" fill="#A8E063" fill-opacity="1" text-anchor="end">0.2%</text>

          <line x1="48" y1="317" x2="850" y2="317"
                stroke="#141C21" stroke-width="1"/>
        </g>
        

    <rect x="42" y="570" width="816" height="1" fill="#182127"/>

    <text x="42" y="594" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="0.7px" fill="#46515A" fill-opacity="1" text-anchor="start">SHARE BASED ON GITHUB BYTE DISTRIBUTION</text>
    <text x="858" y="594" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="1px" fill="#46515A" fill-opacity="1" text-anchor="end">LIVE REPOSITORY DATA</text>

  </g>
</svg>
