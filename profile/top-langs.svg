    <rect x="36" y="27" width="608" height="2" fill="url(#edge)" filter="url(#glowC)"/>
    <text x="40" y="60" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19px" font-weight="800" letter-spacing="1.8px" fill="#F4F7F8" fill-opacity="1" text-anchor="start">LANGUAGE / MATRIX</text>
    <text x="640" y="56" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="1.5px" fill="#69757E" fill-opacity="1" text-anchor="end">CODEBASE</text>
    <text x="640" y="72" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="7px" font-weight="700" letter-spacing="1px" fill="#00F5D4" fill-opacity="1" text-anchor="end">04 LANGUAGES</text>

    <g>
      <circle cx="565" cy="78" r="27" fill="none" stroke="#182329" stroke-width="7"/><circle cx="565" cy="78" r="27" fill="none" stroke="#00F5D4" stroke-width="7" stroke-linecap="round" stroke-dasharray="164.59 169.65" transform="rotate(-90 565 78)" filter="url(#glowC)"/>
