<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="430"
    viewBox="0 0 900 430">

    
    <defs>

        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#020204"/>

            <stop
                offset="50%"
                stop-color="#0A0D14"/>

            <stop
                offset="100%"
                stop-color="#1A0830"/>

        </linearGradient>


        <linearGradient
            id="purpleGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="0">

            <stop
                offset="0%"
                stop-color="#6D28D9"/>

            <stop
                offset="50%"
                stop-color="#A855F7"/>

            <stop
                offset="100%"
                stop-color="#D8B4FE"/>

        </linearGradient>


        <filter
            id="purpleGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

            <feGaussianBlur
                stdDeviation="3"
                result="blur"/>

            <feMerge>

                <feMergeNode
                    in="blur"/>

                <feMergeNode
                    in="SourceGraphic"/>

            </feMerge>

        </filter>


        <pattern
            id="grid"
            width="32"
            height="32"
            patternUnits="userSpaceOnUse">

            <path
                d="M32 0H0V32"
                fill="none"
                stroke="#8B5CF6"
                stroke-opacity="0.055"/>

        </pattern>

    </defs>
    

    <!-- BACKGROUND -->

    <rect
        width="900"
        height="430"
        rx="18"
        fill="url(#background)"
