
<svg xmlns="http://www.w3.org/2000/svg"
     width="650"
     height="430"
     viewBox="0 0 650 430">

<style>
    .title {
        font-family: monospace;
        font-size: 25px;
        font-weight: bold;
        fill: #ffffff;
    }

    .label {
        font-family: monospace;
        font-size: 14px;
        fill: #8b9bb4;
        letter-spacing: 2px;
    }

    .value {
        font-family: monospace;
        font-size: 29px;
        font-weight: bold;
        fill: #ffffff;
    }

    .small {
        font-family: monospace;
        font-size: 12px;
        fill: #718096;
    }

    .accent {
        fill: #ff2bd6;
    }

    .cyan {
        fill: #00e5ff;
    }

    .green {
        fill: #39ff88;
    }

    .glow {
        filter: url(#glow);
    }

    .pulse {
        animation: pulse 2s infinite;
    }

    .scan {
        animation: scan 4s linear infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
    }

    @keyframes scan {
        from { transform: translateY(-20px); }
        to { transform: translateY(450px); }
    }
</style>

<defs>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#090914"/>
        <stop offset="55%" stop-color="#111124"/>
        <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ff2bd6"/>
        <stop offset="50%" stop-color="#00e5ff"/>
        <stop offset="100%" stop-color="#39ff88"/>
    </linearGradient>

    <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".035"/>
    </pattern>

</defs>

<rect width="650" height="430" rx="22"
      fill="url(#background)"
      stroke="#24243d"
      stroke-width="2"/>

<rect width="650" height="430" rx="22"
      fill="url(#grid)"/>

<rect x="0" y="0"
      width="650"
      height="3"
      fill="url(#line)"
      class="glow"/>

<rect x="0" y="-30"
      width="650"
      height="20"
      fill="#00e5ff"
      opacity=".08"
      class="scan"/>

<text x="35" y="55" class="label">
    GITHUB // CORE
</text>

<text x="35" y="92" class="title">
    YEABSIRA
</text>

<circle cx="590" cy="48"
        r="7"
        class="green pulse glow"/>

<text x="535" y="78" class="small">
    ONLINE
</text>

<line x1="35" y1="112"
      x2="615" y2="112"
      stroke="url(#line)"
      stroke-opacity=".5"/>

<!-- PUBLIC REPOSITORIES -->

<text x="55" y="155" class="label">
    REPOSITORIES
</text>

<text x="55" y="195" class="value">
    0
</text>

<text x="55" y="220" class="small">
    PUBLIC
</text>

<!-- FOLLOWERS -->

<text x="245" y="155" class="label">
    FOLLOWERS
</text>

<text x="245" y="195" class="value">
    1
</text>

<text x="245" y="220" class="small">
    NETWORK
</text>

<!-- FOLLOWING -->

<text x="435" y="155" class="label">
    FOLLOWING
</text>

<text x="435" y="195" class="value">
    1
</text>

<text x="435" y="220" class="small">
    CONNECTIONS
</text>

<line x1="55" y1="250"
      x2="595" y2="250"
      stroke="#272741"/>

<text x="55" y="290" class="label">
    SYSTEM STATUS
</text>

<text x="55" y="325" class="cyan value">
    ACTIVE
</text>

<text x="55" y="350" class="small">
    AI ENGINEERING / SOFTWARE DEVELOPMENT
</text>

<text x="55" y="385" class="small">
    DATA STREAM // LIVE
</text>

<circle cx="565" cy="382"
        r="5"
        class="cyan pulse glow"/>

</svg>
